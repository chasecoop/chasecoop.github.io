# Tiles on /projects/ and the home page, in order. One entry per tile.
#   id           slug; also the default thumbnail, src/assets/thumbs/<id>.svg
#   name         shown on hover
#   kind         game, app, three.js, rig, ...
#   description  one line
#   url          optional. A live app (https://..., opens in a new tab) or a
#                project page on this site (/projects/<slug>/). Leave it out
#                and the tile is not a link yet.
#   thumbnail    optional: another file in src/assets/thumbs/ (.svg line art,
#                or a .png/.jpg/.webp still, cropped square)

- id: family-chess
  name: Family Chess
  kind: "[kind]"
  description: "[one-line description]"
  url: https://family-chess.family-chess.workers.dev/

- id: byways
  name: Byways
  kind: "[kind]"
  description: "[one-line description]"

- id: marionette
  name: Marionette
  kind: "[kind]"
  description: "[one-line description]"

- id: torus-knot
  name: Torus Knot
  kind: "[kind]"
  description: "[one-line description]"
  url: /projects/torus-knot/
